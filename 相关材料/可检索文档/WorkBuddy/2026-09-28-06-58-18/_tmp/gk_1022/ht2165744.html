<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 - 页面未找到</title><style>*{ margin: 0; padding: 0; box-sizing: border-box;} body{ font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #f0f7ff, #e6f2ff); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #3a3a68; position: relative; overflow: hidden;} .bg-shapes{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;} .bg-shapes div{ position: absolute;} .shape1{ width: 100px; height: 100px; top: 10%; left: 15%; background: linear-gradient(135deg, rgba(62, 109, 246, 0.1), rgba(54, 94, 210, 0.15)); border-radius: 20px; transform: rotate(45deg); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);} .shape2{ width: 150px; height: 150px; bottom: 20%; right: 20%; background: linear-gradient(135deg, rgba(94, 154, 255, 0.08), rgba(74, 124, 235, 0.12)); border-radius: 50%; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.03);} .shape3{ width: 80px; height: 80px; top: 35%; right: 15%; background: linear-gradient(135deg, rgba(62, 109, 246, 0.1), rgba(54, 94, 210, 0.15)); border-radius: 15px; transform: rotate(15deg);} .error-container{ max-width: 800px; width: 90%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 60px 40px; border-radius: 25px; text-align: center; box-shadow: 0 15px 35px rgba(41, 75, 161, 0.15); position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.5);} .error-container::before{ content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #3e6df6, #5e9aff, #3e6df6);} .error-number{ font-size: 120px; font-weight: 800; color: #3e6df6; text-shadow: 0 5px 15px rgba(62, 109, 246, 0.3); margin-bottom: 30px; letter-spacing: 5px; position: relative; line-height: 1.2; animation: pulse 2s infinite;} .error-img{ max-width: 320px;width: 96%; animation: pulse 2s infinite;} .error-tip{ font-size: 14px; margin-bottom: 15px;} @keyframes pulse{ 0%, 100%{ transform: scale(1);} 50%{ transform: scale(1.02);}} .error-text{ font-size: 36px; font-weight: 600; line-height: 1.6; margin-bottom: 45px; color: #333; position: relative;} .error-text::after{ content: ""; position: absolute; width: 100px; height: 4px; background: linear-gradient(90deg, #3e6df6, #5e9aff); bottom: -25px; left: 50%; transform: translateX(-50%); border-radius: 10px;} .home-button{ background: linear-gradient(90deg, #3e6df6, #5e9aff); color: white; border: none; font-size: 20px; font-weight: 600; padding: 18px 40px; border-radius: 50px; cursor: pointer; transition: all 0.4s ease; box-shadow: 0 8px 20px rgba(62, 109, 246, 0.35); display: inline-flex; align-items: center; justify-content: center; gap: 10px; transform: translateY(0);} .home-button:hover{ transform: translateY(-5px); box-shadow: 0 15px 25px rgba(62, 109, 246, 0.45); background: linear-gradient(90deg, #5e9aff, #3e6df6);} .home-button:active{ transform: translateY(0); box-shadow: 0 5px 15px rgba(62, 109, 246, 0.35);} .button-icon{ font-size: 22px;} .copyright{ margin-top: 50px; font-size: 14px; color: #7a7a96;} @media (max-width: 768px){ .error-number{ font-size: 80px;} .error-text{ font-size: 28px;} .home-button{ font-size: 18px; padding: 15px 30px;}} @media (max-width: 480px){ .error-number{ font-size: 60px;} .error-text{ font-size: 24px;} .error-container{ padding: 40px 20px;}} </style></head><body><div class="bg-shapes"><div class="shape1"></div><div class="shape2"></div><div class="shape3"></div></div><div class="error-container"><p><img class="error-img" src="https://ah.huatu.com/error/404.png"></p><p class="error-tip">您访问的页面不存在</p><div class="error-text">公考之路，难免迷途，愿与你同行共渡</div><button class="home-button" onclick="window.location.href='/'"><span class="button-icon">←</span>返回首页 </button><div class="copyright">©安徽华图教育</div></div><script>function loadArticle(){ const currentUrl=window.location.pathname; const reg=/(\d{4})\/(\d{4})\/(\d{7})\.html/; const matchResult=currentUrl.match(reg); if (window.location.origin==='https://ah.huatu.com' && matchResult){ window.location.href='https://m.ah.huatu.com' + currentUrl;}} loadArticle(); document.addEventListener('DOMContentLoaded', function (){ const errorImg=document.querySelector('.error-img'); setInterval(()=>{ errorImg.style.transform='scale(1.05)'; setTimeout(()=>{ errorImg.style.transform='scale(1)';}, 300);}, 5000);}); </script><script type="text/javascript" src="https://ah.huatu.com/z/js/zztj.js"></script></body></html>
